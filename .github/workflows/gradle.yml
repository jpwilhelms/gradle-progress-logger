name: Java CI with Gradle

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: (!startsWith(github.ref, 'refs/tags/v')) # Don't run normal build for tags

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew build

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # ONLY run for version tags

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Publish Release to Maven Local (Simulated Central)
      run: ./gradlew build publishToMavenLocal -Pversion=${{ steps.get_version.outputs.VERSION }}
      # In the future, this will be: ./gradlew publish -Pversion=...
